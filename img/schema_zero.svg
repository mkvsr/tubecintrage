<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="Segoe UI, DejaVu Sans, sans-serif">
<rect width="680" height="380" fill="#ffffff"/>
<text x="40" y="40" font-size="14" font-weight="600" fill="#1f3b57">1. Mise à zéro (vue de dessus)</text>
<text x="360" y="40" font-size="14" font-weight="600" fill="#1f3b57">2. Après avance Y = 500 et pli à 90°</text>
<circle cx="240" cy="160" r="70" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="240" y="164" font-size="12" text-anchor="middle" fill="#444441">Forme R145</text>
<rect x="48" y="214" width="44" height="42" rx="4" fill="#FAC775" stroke="#854F0B"/>
<text x="70" y="276" font-size="12" text-anchor="middle" fill="#444441">Chariot</text>
<rect x="70" y="223" width="170" height="24" rx="2" fill="#B5D4F4" stroke="#185FA5"/>
<line x1="240" y1="200" x2="240" y2="270" stroke="#E24B4A" stroke-width="3"/>
<text x="252" y="262" font-size="12" fill="#A32D2D">Marque zéro</text>
<line x1="120" y1="200" x2="196" y2="200" stroke="#444441" stroke-width="1.5"/>
<path d="M190 195 L198 200 L190 205" fill="none" stroke="#444441" stroke-width="1.5"/>
<text x="160" y="192" font-size="12" text-anchor="middle" fill="#444441">avance</text>
<text x="40" y="310" font-size="12" fill="#2C2C2A">Extrémité AVANT contre la marque,</text>
<text x="40" y="327" font-size="12" fill="#2C2C2A">bouton jaune (zéro Y). Avancer jusqu'à</text>
<text x="40" y="344" font-size="12" fill="#2C2C2A">Y = 500, cintrer à 90°.</text>
<path d="M370 330 L520 330 A50 50 0 0 0 570 280 L570 110" fill="none" stroke="#85B7EB" stroke-width="22" stroke-linejoin="round"/>
<line x1="350" y1="330" x2="625" y2="330" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 4"/>
<line x1="570" y1="96" x2="570" y2="345" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 4"/>
<circle cx="570" cy="330" r="4" fill="#E24B4A"/>
<text x="578" y="350" font-size="12" fill="#444441">sommet</text>
<line x1="582" y1="110" x2="625" y2="110" stroke="#5F5E5A" stroke-width="0.8"/>
<line x1="615" y1="114" x2="615" y2="326" stroke="#1f3b57" stroke-width="1.2"/>
<path d="M610 120 L615 112 L620 120 M610 320 L615 328 L620 320" fill="none" stroke="#1f3b57" stroke-width="1.2"/>
<text x="624" y="224" font-size="16" font-weight="700" fill="#1f3b57">A</text>
<text x="556" y="104" font-size="12" text-anchor="end" fill="#444441">extrémité AVANT</text>
<text x="556" y="200" font-size="12" text-anchor="end" fill="#444441">branche avant</text>
<text x="556" y="216" font-size="12" text-anchor="end" fill="#444441">(500 mm prévus)</text>
<text x="372" y="364" font-size="12" fill="#444441">vers le chariot</text>
</svg>
